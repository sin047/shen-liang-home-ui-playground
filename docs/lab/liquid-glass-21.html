<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9edf0"><title>家 ^ ^ · Liquid Glass Lab 2.1</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);background:#e9edf0;color:#465158;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:680px;margin:auto;padding:20px 0 40px}.head{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.5px;color:#829097}.head a{color:#829097;text-decoration:none;letter-spacing:0;font-size:12px}.title{font:400 29px Georgia,serif;margin:14px 0 5px}.sub{font-size:12px;line-height:1.8;color:#7c888e;margin:0 0 17px}.stage{height:min(65vh,560px);min-height:430px;position:relative;overflow:hidden;border-radius:27px;isolation:isolate;background:linear-gradient(135deg,#dce7e4,#b8cbd0 48%,#e8e4da);box-shadow:0 16px 42px #4b5c6818}.scene,.glass{position:absolute;inset:0;width:100%;height:100%}.glass{pointer-events:none}.top{position:absolute;z-index:2;top:22px;left:20px;display:flex;gap:10px;align-items:center}.orb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#b7c9c9);font:italic 21px Georgia;color:#708287}.top strong{font:italic 19px Georgia;color:#56666b}.top small{display:block;font-size:10px;color:#718187;margin-top:3px}.messages{position:absolute;z-index:2;top:36%;left:20px;right:20px}.date{font-size:10px;letter-spacing:2px;color:#71848a;margin-bottom:16px}.msg{width:fit-content;max-width:88%;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.62);margin:9px 0;font-size:13px;line-height:1.8;color:#48575c}.right{margin-left:auto}.caption{position:absolute;z-index:2;bottom:20px;left:20px;font-size:9px;letter-spacing:1px;color:#718187}.upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:11px;color:#78858b}.upload label{padding:10px 14px;border-radius:14px;background:#ffffffb8;border:1px solid #fff;color:#52636a}.upload input{position:absolute;width:1px;height:1px;opacity:0}.upload span{font-size:10px}.controls{display:flex;gap:7px;margin:14px 0 10px}.controls button{flex:1;border:1px solid white;border-radius:14px;padding:12px 3px;background:#ffffff82;color:#68777d;font-size:11px}.controls button[aria-pressed=true]{background:#fff;color:#34464e;box-shadow:0 4px 14px #45545b12}.desc{font-size:12px;line-height:1.8;color:#748188;min-height:43px}.tune{padding:13px 15px;border:1px solid white;border-radius:17px;background:#ffffff80;margin-top:10px}.tune label{display:flex;justify-content:space-between;font-size:11px;color:#6e7c82;margin:8px 0}.tune input{width:100%;accent-color:#8da4aa}.note{font-size:10px;line-height:1.8;color:#89949a;margin:14px 2px}
</style></head><body><main class="wrap">
<div class="head"><span>SHEN & LIANG · MATERIAL STUDY</span><a href="../index.html">返回 Playground ↗</a></div>
<h1 class="title">Liquid Glass <small style="font:12px sans-serif;color:#87949c">2.1</small></h1><p class="sub">上传一张背景图片，直接观察聊天气泡自身的玻璃折射。</p>
<div class="upload"><label for="bgUpload">选择自己的背景图片</label><input id="bgUpload" type="file" accept="image/*"><span id="bgName">当前：简洁底色（可上传图片）</span></div>
<section class="stage" id="stage"><canvas class="scene" id="scene"></canvas><canvas class="glass" id="glass"></canvas>
<div class="top"><div class="orb">S</div><div><strong>Shin</strong><small>online · 在家</small></div></div>
<div class="messages"><div class="msg">嗯，过来坐。</div><div class="msg right">今天的光线真好。</div><div class="msg">慢慢说，我在听。</div></div></section>
<div class="controls"><button data-mode="a" aria-pressed="false">A · 柔和玻璃</button><button data-mode="b" aria-pressed="true">B · 透镜折射</button><button data-mode="c" aria-pressed="false">C · 厚边缘</button></div>
<div class="desc" id="desc">折射效果直接作用在三条聊天气泡上，不再覆盖一整块矩形区域。</div>
<div class="tune"><label>折射强度 <output id="po">1.00</output></label><input id="power" type="range" min="0" max="180" value="100"><label>玻璃厚度 <output id="to">0.55</output></label><input id="thick" type="range" min="10" max="100" value="55"></div>
<p class="note">背景图片只在当前浏览器本地使用。WebGL 只对聊天气泡区域进行采样和折射，不会生成额外的大块玻璃面板；这仍是独立背景纹理实验，不是任意 DOM 实时捕获。</p>
</main>
<script>
(()=>{
const scene=document.getElementById('scene'),canvas=document.getElementById('glass'),stage=document.getElementById('stage'),ctx=scene.getContext('2d'),power=document.getElementById('power'),thick=document.getElementById('thick');let gl,program,tex,u,mode='b',customImage=null;
function paint(w,h,d){
 scene.width=Math.round(w*d);scene.height=Math.round(h*d);
 ctx.setTransform(d,0,0,d,0,0);
 if(customImage){
  const iw=customImage.width,ih=customImage.height,scale=Math.max(w/iw,h/ih);
  const cw=w/scale,ch=h/scale,sx=(iw-cw)/2,sy=(ih-ch)/2;
  ctx.drawImage(customImage,sx,sy,cw,ch,0,0,w,h);
 }else{
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#e8eceb');g.addColorStop(.52,'#cbd5d5');g.addColorStop(1,'#e7e5df');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 }
}
const vs='attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const fs='precision highp float;varying vec2 uv;uniform sampler2D bg;uniform vec2 resolution;uniform vec4 r0;uniform vec4 r1;uniform vec4 r2;uniform float power;uniform float thickness;uniform float mode;float sdRound(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return min(max(q.x,q.y),0.)+length(max(q,0.))-r;}void main(){vec2 px=uv*resolution;vec4 rr[3];rr[0]=r0;rr[1]=r1;rr[2]=r2;float best=1e9;vec2 chosenLocal=vec2(0.);float chosenDist=1e9;float chosenScale=1.;for(int i=0;i<3;i++){vec4 q=rr[i];if(q.z<1.)continue;vec2 local=(px-(q.xy+q.zw*.5))/(q.zw*.5);float dist=sdRound(local,vec2(1.),.24);float distPx=dist*min(q.z,q.w)*.5;if(distPx<best){best=distPx;chosenDist=dist;chosenLocal=local;chosenScale=min(q.z,q.w);}}if(best>1.5){gl_FragColor=vec4(0.);return;}float bevel=pow(max(0.,1.-abs(chosenDist)/.30),.65);vec2 normal=normalize(chosenLocal+vec2(.0001))*bevel;float k=power*(.004+thickness*.012);if(mode<.5)k*=.35;if(mode>1.5)k*=1.35;vec2 suv=clamp(uv+vec2(normal.x*k,-normal.y*k),vec2(0.),vec2(1.));vec3 refr=texture2D(bg,suv).rgb;float inside=clamp(-best/(chosenScale*.11),0.,1.);float fres=pow(1.-inside,2.2);float rim=pow(max(0.,1.-abs(best)/max(1.,chosenScale*.055)),1.7);float hi=pow(max(0.,dot(normalize(vec3(normal,1.)),normalize(vec3(-.4,.7,1.)))),5.);vec3 color=mix(refr,vec3(.94,.97,1.),.025+thickness*.018);color=mix(color,vec3(1.),rim*.20+fres*.035+hi*.07);float alpha=.82+rim*.13+fres*.025;gl_FragColor=vec4(color,alpha); }';
function compile(t,s){let sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}
function draw(){
 if(!gl)return;
 const stageRect=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 const bubbles=[...stage.querySelectorAll('.msg')].slice(0,3);
 const rects=bubbles.map(el=>{const r=el.getBoundingClientRect();return [(r.left-stageRect.left)*d,(stageRect.bottom-r.bottom)*d,r.width*d,r.height*d]});
 while(rects.length<3)rects.push([0,0,0,0]);
 gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(program);gl.uniform1i(u.bg,0);
 gl.uniform4fv(u.r0,rects[0]);gl.uniform4fv(u.r1,rects[1]);gl.uniform4fv(u.r2,rects[2]);
 gl.uniform1f(u.power,+power.value/100);gl.uniform1f(u.thickness,+thick.value/100);
 gl.uniform1f(u.mode,mode==='a'?0:mode==='b'?1:2);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function resize(){let r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);paint(r.width,r.height,d);canvas.width=w;canvas.height=h;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';gl.viewport(0,0,w,h);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scene);gl.uniform2f(u.resolution,w,h);draw()}
try{gl=canvas.getContext('webgl',{alpha:true,antialias:true})||canvas.getContext('experimental-webgl');if(!gl)throw Error('此浏览器没有可用的 WebGL');program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vs));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);u={bg:gl.getUniformLocation(program,'bg'),resolution:gl.getUniformLocation(program,'resolution'),r0:gl.getUniformLocation(program,'r0'),r1:gl.getUniformLocation(program,'r1'),r2:gl.getUniformLocation(program,'r2'),power:gl.getUniformLocation(program,'power'),thickness:gl.getUniformLocation(program,'thickness'),mode:gl.getUniformLocation(program,'mode')};tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);resize()}catch(e){document.getElementById('desc').textContent='WebGL 初始化失败：'+e.message}
const descriptions={a:'A：轻微折射与薄边缘，适合低存在感的日常玻璃。',b:'B：折射直接作用于聊天气泡，观察气泡内部的背景位移和边缘高光。',c:'C：增加气泡边缘厚度、折射位移和边缘高光。'};
document.querySelectorAll('[data-mode]').forEach(x=>x.addEventListener('click',()=>{mode=x.dataset.mode;document.querySelectorAll('[data-mode]').forEach(y=>y.setAttribute('aria-pressed',String(y===x)));document.getElementById('desc').textContent=descriptions[mode];draw()}));[power,thick].forEach(x=>x.addEventListener('input',()=>{document.getElementById(x.id==='power'?'po':'to').value=(+x.value/100).toFixed(2);draw()}));document.getElementById('bgUpload').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{customImage=img;document.getElementById('bgName').textContent='当前：'+file.name;resize();URL.revokeObjectURL(url)};img.onerror=()=>{document.getElementById('bgName').textContent='图片读取失败';URL.revokeObjectURL(url)};img.src=url;});window.addEventListener('resize',()=>{if(gl)resize()});
})();
</script></body></html>
